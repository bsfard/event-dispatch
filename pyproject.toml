[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eventdispatch"
version = "0.0.7"
description = "In-process event dispatching for Python applications."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Ben Sfard", email = "bsfard@gmail.com" },
]
[project.urls]
Homepage = "https://github.com/bsfard/event-dispatch"
Repository = "https://github.com/bsfard/event-dispatch"
Issues = "https://github.com/bsfard/event-dispatch/issues"

[tool.setuptools.packages.find]
include = ["eventdispatch*"]
